# Publica la app PrecioListo (ya construida y minificada) en GitHub Pages.
# El código fuente legible está en el repositorio privado.
name: Publicar app

on:
  push:
    branches: [main]
    paths: ['app/**']
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: despliegue
        uses: actions/deploy-pages@v4
